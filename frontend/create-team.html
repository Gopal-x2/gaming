<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Team - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="/matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="/leaderboard.html">Leaderboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 680px;">
    <div class="card-glass">
      <h2 class="text-uppercase text-light mb-1"><i class="fas fa-users-cog text-success me-2"></i> Create Esports Squad</h2>
      <p class="text-muted mb-4">Form your team, assign captain roles, and invite players to participate in tournaments.</p>

      <form onsubmit="handleCreateTeam(event)">
        <div class="mb-3">
          <label class="form-label text-muted text-uppercase fs-7">Team Name</label>
          <input type="text" id="teamName" class="form-control" placeholder="e.g. Warriors Gaming" required>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted text-uppercase fs-7">Primary Game</label>
          <select id="gameSelect" class="form-select" required>
            <option value="BGMI">BGMI</option>
            <option value="Free Fire">Free Fire</option>
            <option value="Valorant">Valorant</option>
            <option value="Counter-Strike">Counter-Strike</option>
            <option value="FIFA / EA FC">FIFA / EA FC</option>
            <option value="Call of Duty">Call of Duty</option>
            <option value="PUBG">PUBG</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted text-uppercase fs-7">Captain In-Game ID / Tag</label>
          <input type="text" id="captainInGameId" class="form-control" placeholder="e.g. 512345678 or Alex#1337" required>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted text-uppercase fs-7">Team Logo URL (Optional)</label>
          <input type="url" id="teamLogo" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="mb-4">
          <label class="form-label text-muted text-uppercase fs-7">Contact Phone Number</label>
          <input type="tel" id="contactPhone" class="form-control" placeholder="9876543210" required>
        </div>

        <button type="submit" class="btn-neon w-100 justify-content-center btn-lg"><i class="fas fa-plus-circle me-2"></i> Create Team</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/teams.js"></script>
</body>
</html>
