<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Details - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="/matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="/leaderboard.html">Leaderboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="card-glass mb-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div class="d-flex align-items-center gap-3">
          <img id="team-logo" src="" class="rounded-circle" width="70" height="70" style="object-fit:cover;">
          <div>
            <h2 id="team-title" class="text-light mb-0"></h2>
            <span id="team-game" class="badge bg-dark border border-secondary text-success mt-1"></span>
            <div class="text-muted fs-7 mt-1">Captain: <strong id="captain-name" class="text-light"></strong></div>
          </div>
        </div>

        <div id="captain-invite-section" class="d-none d-flex gap-2">
          <button class="btn-outline-neon" data-bs-toggle="modal" data-bs-target="#editTeamModal">
            <i class="fas fa-edit me-1"></i> Edit Team Info
          </button>
          <button class="btn-neon" data-bs-toggle="modal" data-bs-target="#invitePlayerModal">
            <i class="fas fa-user-plus me-1"></i> Invite Player
          </button>
        </div>
      </div>
    </div>

    <!-- Team Members List -->
    <div class="card-glass">
      <h4 class="text-uppercase text-light mb-4"><i class="fas fa-users text-success me-2"></i> Team Roster (<span id="member-count">0</span> Players)</h4>
      <div class="row" id="team-members-list">
        <!-- Populated by teams.js -->
      </div>
    </div>
  </div>

  <!-- Edit Team Modal -->
  <div class="modal fade" id="editTeamModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-secondary border-secondary text-light">
        <div class="modal-header border-secondary">
          <h5 class="modal-title text-uppercase"><i class="fas fa-edit text-success me-2"></i> Edit Team Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="handleUpdateTeam(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label text-muted text-uppercase fs-7">Team Name</label>
              <input type="text" id="edit-team-name" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted text-uppercase fs-7">Primary Game</label>
              <select id="edit-team-game" class="form-select bg-dark text-light border-secondary" required>
                <option value="BGMI">BGMI</option>
                <option value="Free Fire">Free Fire</option>
                <option value="Valorant">Valorant</option>
                <option value="Counter-Strike">Counter-Strike</option>
                <option value="FIFA / EA FC">FIFA / EA FC</option>
                <option value="Call of Duty">Call of Duty</option>
                <option value="PUBG">PUBG</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted text-uppercase fs-7">Team Logo URL</label>
              <input type="url" id="edit-team-logo" class="form-control bg-dark text-light border-secondary">
            </div>
            <div class="mb-3">
              <label class="form-label text-muted text-uppercase fs-7">Contact Phone Number</label>
              <input type="tel" id="edit-team-phone" class="form-control bg-dark text-light border-secondary">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-neon"><i class="fas fa-save me-1"></i> Save Team Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Invite Player Modal -->
  <div class="modal fade" id="invitePlayerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-secondary border-secondary text-light">
        <div class="modal-header border-secondary">
          <h5 class="modal-title text-uppercase"><i class="fas fa-paper-plane text-success me-2"></i> Invite Registered Player</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label text-muted text-uppercase fs-7">Search Username or Email</label>
            <input type="text" id="user-search-input" class="form-control bg-dark text-light border-secondary" placeholder="Type at least 2 characters..." oninput="searchUsersForInvite()">
          </div>
          <div id="user-search-results" class="mt-3">
            <!-- Search items -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/teams.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => loadTeamDetails());
  </script>
</body>
</html>
