<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Leaderboard - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="/matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link active" href="/leaderboard.html">Leaderboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="mb-4">
      <h1 class="text-uppercase text-light mb-1"><i class="fas fa-list-ol text-success me-2"></i> Live Tournament Leaderboard</h1>
      <p class="text-muted mb-0">Real-time team standings, kills, victory points, and rankings.</p>
    </div>

    <!-- Select Tournament Dropdown -->
    <div class="card-glass mb-4 p-3">
      <div class="row align-items-center">
        <div class="col-md-3 text-muted text-uppercase fw-bold">Select Tournament:</div>
        <div class="col-md-9">
          <select id="tournament-select" class="form-select bg-dark text-light border-secondary" onchange="window.location.href='/leaderboard.html?tournamentId=' + this.value">
            <option value="">-- Choose a Tournament --</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Standings Table -->
    <div class="card-glass p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-custom mb-0">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Matches</th>
              <th>Wins</th>
              <th>Kills</th>
              <th>Total Points</th>
              <th>Prize Won</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <!-- Populated by leaderboard.js -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const data = await apiRequest('/tournaments?status=', 'GET', null, false);
        const select = document.getElementById('tournament-select');
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('tournamentId');

        data.tournaments.forEach((t) => {
          const opt = document.createElement('option');
          opt.value = t._id;
          opt.textContent = `${t.title} (${t.game})`;
          if (t._id === currentId) opt.selected = true;
          select.appendChild(opt);
        });

        // Auto-select first if none specified
        if (!currentId && data.tournaments.length > 0) {
          select.value = data.tournaments[0]._id;
          window.history.replaceState(null, '', `/leaderboard.html?tournamentId=${data.tournaments[0]._id}`);
        }
        loadLeaderboard();
      } catch (e) {
        showToast(e.message, 'error');
      }
    });
  </script>
</body>
</html>
