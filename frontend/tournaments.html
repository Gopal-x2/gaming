<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tournament.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="/matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="/leaderboard.html">Leaderboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <!-- Main Section -->
  <div class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
      <div>
        <h1 class="text-light text-uppercase mb-1"><i class="fas fa-trophy text-success me-2"></i> All Esports Tournaments</h1>
        <p class="text-muted mb-0">Browse open championships, enter your team, and claim your share of prize pools.</p>
      </div>
    </div>

    <!-- Search & Filters Bar -->
    <div class="card-glass mb-4 p-3">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" id="search-input" class="form-control" placeholder="Search by tournament title..." oninput="loadTournamentsList()">
        </div>
        <div class="col-md-3">
          <select id="game-filter" class="form-select" onchange="loadTournamentsList()">
            <option value="">All Games</option>
            <option value="BGMI">BGMI</option>
            <option value="Free Fire">Free Fire</option>
            <option value="Valorant">Valorant</option>
            <option value="Counter-Strike">Counter-Strike</option>
            <option value="FIFA / EA FC">FIFA / EA FC</option>
            <option value="Call of Duty">Call of Duty</option>
            <option value="PUBG">PUBG</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="format-filter" class="form-select" onchange="loadTournamentsList()">
            <option value="">All Formats</option>
            <option value="Solo">Solo</option>
            <option value="Duo">Duo</option>
            <option value="Squad">Squad</option>
            <option value="5v5">5v5</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="sort-filter" class="form-select" onchange="loadTournamentsList()">
            <option value="">Sort By: Newest</option>
            <option value="prize_high">Prize Pool: High to Low</option>
            <option value="fee_low">Entry Fee: Low to High</option>
            <option value="fee_high">Entry Fee: High to Low</option>
            <option value="date">Starting Date</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Tournaments Grid -->
    <div class="row" id="tournaments-container">
      <!-- Populated by tournaments.js -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/tournaments.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => loadTournamentsList());
  </script>
</body>
</html>
