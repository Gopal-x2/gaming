<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2 class="text-uppercase"><i class="fas fa-key text-success me-2"></i> Reset Password</h2>
        <p>Enter your registered email to receive password reset link</p>
      </div>

      <form onsubmit="handleForgotPassword(event)">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="your_email@example.com" required>
        </div>
        <button type="submit" class="btn-neon w-100 mt-3 justify-content-center">Send Reset Link <i class="fas fa-paper-plane ms-2"></i></button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary">
        <a href="/login.html" class="text-success fw-bold text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
