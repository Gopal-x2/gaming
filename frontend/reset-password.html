<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2 class="text-uppercase"><i class="fas fa-lock text-success me-2"></i> Set New Password</h2>
        <p>Enter your new password below</p>
      </div>

      <form onsubmit="handleResetPassword(event)">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn-neon w-100 mt-3 justify-content-center">Update Password <i class="fas fa-check ms-2"></i></button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
