<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="/matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="/leaderboard.html">Leaderboard</a></li>
        </ul>
        <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 680px;">
    <div class="card-glass">
      <!-- Profile Header & Avatar Upload Area -->
      <div class="text-center mb-4 position-relative">
        <div class="position-relative d-inline-block">
          <img id="profile-avatar-img" src="" class="rounded-circle border border-success p-1 shadow" width="110" height="110" style="object-fit:cover;">
          <button type="button" class="btn btn-sm btn-dark position-absolute bottom-0 end-0 rounded-circle border border-success p-2 text-success" title="Upload New Profile Image" onclick="document.getElementById('avatar-file-input').click()">
            <i class="fas fa-camera"></i>
          </button>
        </div>
        
        <!-- Hidden File Input for Image Upload -->
        <input type="file" id="avatar-file-input" accept="image/*" class="d-none" onchange="uploadProfileImage(event)">
        
        <h3 id="profile-name" class="text-light mb-0 mt-2"></h3>
        <span id="profile-role" class="badge bg-warning text-dark mt-1"></span>
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-success" onclick="document.getElementById('avatar-file-input').click()">
            <i class="fas fa-upload me-1"></i> Upload Image File
          </button>
        </div>
      </div>

      <form onsubmit="handleUpdateProfile(event)">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted text-uppercase fs-7">Full Name</label>
            <input type="text" id="p-name" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted text-uppercase fs-7">Username</label>
            <input type="text" id="p-username" class="form-control" disabled readonly>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted text-uppercase fs-7">Email Address</label>
            <input type="email" id="p-email" class="form-control" disabled readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted text-uppercase fs-7">Phone Number</label>
            <input type="tel" id="p-phone" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted text-uppercase fs-7">Avatar Image URL (Or Upload Above)</label>
          <input type="text" id="p-avatar" class="form-control">
        </div>

        <div class="mb-4">
          <label class="form-label text-muted text-uppercase fs-7">Bio / About Me</label>
          <textarea id="p-bio" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn-neon w-100 justify-content-center"><i class="fas fa-save me-2"></i> Save Profile Changes</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const data = await apiRequest('/auth/me', 'GET', null, true);
        const u = data.user;
        document.getElementById('profile-avatar-img').src = u.avatar;
        document.getElementById('profile-name').textContent = u.name;
        document.getElementById('profile-role').textContent = u.role;
        document.getElementById('p-name').value = u.name;
        document.getElementById('p-username').value = u.username;
        document.getElementById('p-email').value = u.email;
        document.getElementById('p-phone').value = u.phone;
        document.getElementById('p-avatar').value = u.avatar;
        document.getElementById('p-bio').value = u.bio || '';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    async function uploadProfileImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('avatar', file);

      try {
        showToast('Uploading profile picture...', 'warning');

        const token = getToken();
        const response = await fetch('/api/users/avatar', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Image upload failed');

        document.getElementById('profile-avatar-img').src = data.avatar;
        document.getElementById('p-avatar').value = data.avatar;

        const user = getUser();
        if (user) {
          user.avatar = data.avatar;
          setAuth(token, user);
        }

        showToast('Profile picture uploaded successfully!');
        updateNavbar();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      try {
        const res = await apiRequest('/users/profile', 'PUT', {
          name: document.getElementById('p-name').value.trim(),
          phone: document.getElementById('p-phone').value.trim(),
          avatar: document.getElementById('p-avatar').value.trim(),
          bio: document.getElementById('p-bio').value.trim(),
        });
        setAuth(getToken(), res.user);
        showToast('Profile updated successfully!');
        setTimeout(() => location.reload(), 1000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
