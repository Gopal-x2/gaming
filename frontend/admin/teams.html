<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Teams - Nexus Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-user-shield text-warning me-1"></i> NEXUS<span>ADMIN</span></a>
      <ul class="navbar-nav ms-auto" id="auth-nav"></ul>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard.html" class="admin-sidebar-link"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="/admin/tournaments.html" class="admin-sidebar-link"><i class="fas fa-trophy"></i> Tournaments</a>
      <a href="/admin/create-tournament.html" class="admin-sidebar-link"><i class="fas fa-plus-circle"></i> Create Tournament</a>
      <a href="/admin/teams.html" class="admin-sidebar-link active"><i class="fas fa-users"></i> Teams</a>
      <a href="/admin/matches.html" class="admin-sidebar-link"><i class="fas fa-gamepad"></i> Matches & Rooms</a>
      <a href="/admin/results.html" class="admin-sidebar-link"><i class="fas fa-medal"></i> Declare Results</a>
      <a href="/admin/users.html" class="admin-sidebar-link"><i class="fas fa-user-cog"></i> Users</a>
      <a href="/admin/payments.html" class="admin-sidebar-link"><i class="fas fa-receipt"></i> Payments & Revenue</a>
      <a href="/index.html" class="admin-sidebar-link text-danger mt-auto"><i class="fas fa-globe"></i> Back to Main Site</a>
    </aside>

    <main class="admin-content">
      <div class="mb-4">
        <h1 class="text-uppercase text-light mb-1"><i class="fas fa-users text-warning me-2"></i> All Registered Teams</h1>
        <p class="text-muted mb-0">Inspect teams created across all esports titles.</p>
      </div>

      <div class="row" id="admin-teams-grid">
        <!-- Populated dynamically -->
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      checkAdminAccess();
      try {
        const data = await apiRequest('/admin/teams', 'GET', null, true);
        const grid = document.getElementById('admin-teams-grid');
        grid.innerHTML = data.teams.map(t => `
          <div class="col-md-4 mb-4">
            <div class="card-glass">
              <div class="d-flex align-items-center gap-3 mb-3">
                <img src="${t.logo}" class="rounded-circle" width="50" height="50">
                <div>
                  <h4 class="mb-0 text-light">${t.name}</h4>
                  <span class="badge bg-dark border border-secondary text-success">${t.game}</span>
                </div>
              </div>
              <p class="text-muted mb-1">Captain: <strong>${t.captain ? t.captain.name : 'Unknown'}</strong></p>
              <p class="text-muted mb-2">Members: <strong>${t.members.length} Players</strong></p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
