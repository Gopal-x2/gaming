<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexus Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html"><i class="fas fa-gamepad text-success me-1"></i> NEXUS<span>ESPORTS</span></a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2 class="text-uppercase"><i class="fas fa-sign-in-alt text-success me-2"></i> User Login</h2>
        <p>Access your tournament dashboard & teams</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email or Username</label>
          <input type="text" id="loginKey" class="form-control" placeholder="admin or user@example.com" required>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label">Password</label>
            <a href="/forgot-password.html" class="text-success fs-7 text-decoration-none">Forgot Password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-neon w-100 mt-3 justify-content-center">Login to Dashboard <i class="fas fa-arrow-right ms-2"></i></button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary">
        <span class="text-muted fs-7">Don't have an account?</span>
        <a href="/register.html" class="text-success fw-bold ms-1 text-decoration-none">Register Here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
